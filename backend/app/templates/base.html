<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="description" content="{% block description %}自动采集高质量 AI 资讯，大模型生成摘要、评分与每日趋势日报{% endblock %}" />
  <meta property="og:type" content="{% block og_type %}website{% endblock %}" />
  <meta property="og:title" content="{% block og_title %}AI 资讯站 — 每日精选 AI 资讯与大模型日报{% endblock %}" />
  <meta property="og:description" content="{% block og_description %}自动采集高质量 AI 资讯，大模型提炼摘要、评分与趋势日报{% endblock %}" />
  <meta property="og:site_name" content="AI 资讯站" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>{% block title %}AI 资讯站 — 每日精选 AI 资讯与大模型日报{% endblock %}</title>
  <link rel="alternate" type="application/rss+xml" title="AI 资讯站 RSS" href="/rss" />
  <link rel="stylesheet" href="/static/css/main.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <span class="brand-mark">AI</span>
        <span class="brand-name">资讯站</span>
      </a>
      <nav class="nav">
        <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">资讯</a>
        <a href="/digest" class="nav-link {% if request.url.path.startswith('/digest') %}active{% endif %}">日报</a>
        <a href="/ask" class="nav-link {% if request.url.path.startswith('/ask') %}active{% endif %}">问答</a>
        <a href="/guestbook" class="nav-link {% if request.url.path.startswith('/guestbook') %}active{% endif %}">留言</a>
        <a href="/about" class="nav-link {% if request.url.path.startswith('/about') %}active{% endif %}">关于</a>
      </nav>
      <div class="header-right">
        {% if stats and stats.today is defined %}
        <span class="stat-chip">今日 <b>{{ stats.today }}</b> 条</span>
        {% endif %}
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题" title="切换深色/浅色模式">
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="app-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="container footer-inner">
      <span>AI 资讯站</span>
      <span class="footer-dot">·</span>
      <span>每日自动采集 · 大模型整合</span>
      <a href="/admin" class="footer-admin">管理</a>
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('themeToggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme');
        var next = cur === 'dark' ? 'light' : 'dark';
        if (next === 'light') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
