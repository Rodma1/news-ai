{% extends "admin/base.html" %}

{% block admin_content %}
<div class="admin-shell">
  <aside class="sidebar">
    <div class="side-brand"><span class="brand-mark">AI</span><span>管理后台</span></div>
    <nav class="side-nav">
      <a class="side-link {% if page == 'dashboard' %}active{% endif %}" href="/news/admin/dashboard">仪表盘</a>
      <a class="side-link {% if page == 'articles' %}active{% endif %}" href="/news/admin/articles">文章管理</a>
      <a class="side-link {% if page == 'guestbook' %}active{% endif %}" href="/news/admin/guestbook">留言管理</a>
      <a class="side-link {% if page == 'sources' %}active{% endif %}" href="/news/admin/sources">信息源</a>
      <a class="side-link {% if page == 'settings' %}active{% endif %}" href="/news/admin/settings">设置</a>
      <a class="side-link {% if page == 'tokens' %}active{% endif %}" href="/news/admin/tokens">推送 Token</a>
    </nav>
    <button class="side-link logout" onclick="logout()">退出登录</button>
  </aside>
  <main class="admin-main">
    {% block page %}{% endblock %}
  </main>
</div>
<script>
function logout() {
  document.cookie = 'admin_token=; path=/; max-age=0';
  location.href = '/news/admin/login';
}
async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options
  });
  if (res.status === 401) { location.href = '/news/admin/login'; throw new Error('unauthorized'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || ('HTTP ' + res.status));
  return data;
}
</script>
{% endblock %}

{% block scripts %}{% endblock %}
